[project]
name = "localreviewer"
version = "0.6.1"
description = "Локальное десктоп-приложение для ревью и разметки датасетов"
requires-python = ">=3.11"
dependencies = [
  "PySide6==6.7.2",
  "PySide6-Fluent-Widgets==1.11.3",
  "openpyxl==3.1.5",
  "odfpy==1.4.1",
  "matplotlib==3.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
