[project]
name = "localreviewer"
version = "1.3.0"
description = "Локальное десктоп-приложение для ревью и разметки датасетов"
requires-python = ">=3.11"
dependencies = [
  "PySide6==6.11.2",
  "PySide6-Fluent-Widgets==1.11.3",
  "openpyxl==3.1.5",
  "odfpy==1.4.1",
  "matplotlib==3.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Корень репо в sys.path при любом запуске (голый `pytest` в CI
# иначе не видит модули: спасало только `python -m`). Сломано с тех пор,
# как из tests/ убрали __init__.py.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
