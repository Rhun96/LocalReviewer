name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller LocalReviewer.spec --noconfirm
      - name: Pack
        run: Compress-Archive -Path dist/LocalReviewer -DestinationPath LocalReviewer-win64.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: LocalReviewer-win64.zip
          generate_release_notes: true
